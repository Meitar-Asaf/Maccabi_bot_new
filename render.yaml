services:
  - type: web
    name: maccabi-fan-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash render-start.sh
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_PREFIX
        value: /api
      - key: HIGHLIGHT_SEARCH_DELAY_SECONDS
        value: "120"
      - key: MATCH_POLL_INTERVAL_SECONDS
        value: "60"
